name: Build and Release Pipeline
on:
  push:
    branches:
      - master
permissions:
  contents: read

jobs:
  build-pipeline:
    name: "Build ${{ matrix.target }}"
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target=${{ matrix.target }}

      - name: Create Unix Archive
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          TARGET: ${{ matrix.target }}
          srcdir: .
          pkgdir: /tmp/pkg
        run: |
          mkdir -p ${pkgdir}
          source scripts/ci/install
          tar -czf tpi-${{ matrix.target }}.tar.gz -C ${pkgdir} .

      - name: Upload Archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            tpi-${{ matrix.target }}.tar.gz

      - name: Upload Archive (Win)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tpi.exe

  debian-packages:
    runs-on: ubuntu-latest
    needs: build-pipeline
    strategy:
      matrix:
        target:
          - aarch64
          - x86_64
        include:
          - target: x86_64
            arch: amd64
          - target: aarch64
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}-unknown-linux-gnu

      - name: Extract version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_NAME=tpi-$VERSION-${{ matrix.target }}-linux" >> $GITHUB_ENV

      - name: Extract tar.gz file
        run: |
          mkdir ${{ env.PKG_NAME }}
          tar -xf tpi-${{ matrix.target }}-unknown-linux-gnu.tar.gz -C ${{ env.PKG_NAME }}

      - name: Create DEBIAN package
        run: scripts/ci/create_debian_control.sh Cargo.toml ${{ matrix.arch }} ${{ env.PKG_NAME }}

      - run: dpkg-deb --build ${{ env.PKG_NAME }}

      - name: Upload Archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PKG_NAME }}.deb
          path: ${{ env.PKG_NAME }}.deb

  try-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: debian-packages
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Extract version from Cargo.toml
        id: extract_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if tag exists
        run: |
          if git rev-parse --verify v${VERSION} >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "no new version detected, aborting release Pipeline"
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create new tag
        if: ${{ env.TAG_EXISTS == 'false' }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "noreply@turingpi.com"
          git tag -a "v${{ env.VERSION }}" -m "Release version ${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: tpi v${{ env.VERSION }}
          tag: v${{ env.VERSION }}
          artifacts: artifacts/*
          generateReleaseNotes: true
