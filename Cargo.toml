[package]
name = "tpi"
version = "1.0.7"
edition = "2021"
license = "Apache-2.0"
authors = ["Sven Rademakers <sven.rademakers@gmail.com>"]
description = "Official Turing-Pi2 CLI tool"
homepage = "https://turingpi.com/"
repository = "https://github.com/turing-machines/tpi"
readme = "README.md"
categories= ["command-line-interface"]
keywords= ["turing-pi", "tpi", "CLI", "edge-computing", "board-management"]
exclude = [".github", "deny.toml", "scripts/ci/*"]

[dependencies]
anyhow = "1.0.96"
clap = { version = "4.5.30", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5.45"
crossterm = "0.29.0"
dirs = "7.0.0"
indicatif = { version = "0.18.6", features = ["tokio"] }
platform-info = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "multipart", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"], optional = true }
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tokio-util = "0.7.13"
url = "2.5.4"
board-info = { git = "https://github.com/turing-machines/bmcd", rev = "a15e8fc2341bf762a8f653a2d9e6b5491f22df7d", features = ["clap_derive"], optional = true }



[features]
default = ["rustls"]
rustls = ["reqwest/rustls-no-provider", "dep:rustls"]
native-tls = ["reqwest/native-tls"]
localhost = ["board-info"]

[profile.release]
lto = true
strip = true
